[package]
name = "eve-bpo-tracker"
authors = ["Solus Interactive"]
version = "0.2.0"
edition = "2024"
description = "AlecaFrame-style collection tracker for EVE Online blueprint originals"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "accesskit", "clipboard"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Rename exe
        # EVE-BPO-Tracker.exe is the same build under the pre-rename name, so copies
        # installed before the rename can still find it through the in-app updater.
        run: |
          Copy-Item target/release/slipway.exe Slipway.exe
          Copy-Item target/release/slipway.exe EVE-BPO-Tracker.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Slipway
          path: Slipway.exe

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Slipway.exe
            EVE-BPO-Tracker.exe
